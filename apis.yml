name: Alta VR
description: >-
  Alta VR (legally Another Axiom LLC) is a virtual reality game studio behind
  Gorilla Tag, one of the most-played VR titles ever, and the newer social VR
  world Orion Drift. The studio builds imaginative, physics-driven multiplayer
  experiences centered on hand-based locomotion and social play across Meta
  Quest, Steam, and other VR platforms. It runs an Another Axiom Creator
  Program for community map-building and content creation, and publishes game
  code and Unity map-export tooling through its public GitHub organization.
  Alta VR is a portfolio company of a16z. As a VR consumer game studio it does
  not currently operate a public developer API, OpenAPI specification, or SDK
  program; its developer-facing surface is limited to open-source game code,
  custom map tooling, and creator resources.
